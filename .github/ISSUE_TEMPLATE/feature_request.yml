name: 功能建议
description: 说明你希望解决的问题，以及理想的使用方式。
title: "[建议] "
body:
  - type: markdown
    attributes:
      value: |
        先说用途和遇到的困难即可，不需要准备技术方案。

        **Issue 会公开。** 请使用不含私人内容的例子；截图请先脱敏，不要附上 API 密钥、登录文件或账号信息。
  - type: textarea
    id: purpose
    attributes:
      label: 你希望解决什么问题？
      description: 谁会在什么场景下使用？目前哪里不方便？
      placeholder: 我在……时，需要……，现在只能……
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 你希望它怎样工作？
      description: 描述希望进行的操作和看到的结果，也可以给一个具体例子。
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 当前做法或补充说明（可选）
      description: 可以说明尝试过的替代方法、使用频率或已脱敏的参考截图。
