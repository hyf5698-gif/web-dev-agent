<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#f3efe5">
<title>纸间 · 阅读清单</title><link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 32 32%22%3E%3Crect width=%2232%22 height=%2232%22 rx=%226%22 fill=%22%23254d40%22/%3E%3Cpath d=%22M9 7h14v18H9zM12 7v18M15 12h5M15 16h5%22 fill=%22none%22 stroke=%22%23f3efe5%22/%3E%3C/svg%3E">
<style>
:root{--paper:#f3efe5;--ink:#25251f;--accent:#254d40;--muted:#797569;--line:#d5cdbf}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font-family:system-ui,-apple-system,"Microsoft YaHei",sans-serif}button,input{font:inherit}button{cursor:pointer}button:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:5px}.page{max-width:1120px;margin:auto;padding:0 54px}header{height:101px;border-bottom:1px solid var(--ink);display:flex;align-items:center;justify-content:space-between}.brand{font-family:SimSun,"Songti SC",serif;font-size:29px;font-weight:bold;letter-spacing:5px}.brand small{font:10px system-ui;letter-spacing:2px;margin-left:19px;color:var(--muted)}.edition{font-size:11px;letter-spacing:2px;color:var(--muted)}.hero{padding:66px 0 46px;display:flex;justify-content:space-between;gap:30px}.eyebrow{font-size:11px;letter-spacing:3px;color:var(--accent);margin:0 0 22px}h1{font-family:SimSun,"Songti SC",serif;font-weight:500;font-size:70px;letter-spacing:2px;line-height:1.24;margin:0}.intro{color:var(--muted);font-size:14px;line-height:1.9;margin:23px 0 0}.art{width:185px;flex-shrink:0;align-self:center;transform:rotate(-9deg);position:relative;margin:7px 27px 0 0}.book{height:151px;width:168px;position:relative;border:1px solid var(--ink);border-radius:2px 9px 8px 2px;background:var(--paper);box-shadow:4px 5px 0 var(--paper),5px 6px 0 var(--ink)}.book:before{content:"";position:absolute;inset:0 auto 0 17px;border-left:1px solid var(--ink)}.book:after{content:"";position:absolute;top:-1px;right:29px;width:18px;height:58px;background:var(--accent);clip-path:polygon(0 0,100% 0,100% 100%,50% 82%,0 100%)}.book-lines{position:absolute;top:54px;left:41px;width:65px;height:31px;border-top:1px solid var(--ink);border-bottom:1px solid var(--ink)}.art-caption{font-family:SimSun,"Songti SC",serif;font-style:normal;font-size:12px;color:var(--muted);margin:22px 0 0 24px;letter-spacing:1px}form{display:flex;border-bottom:1px solid var(--ink);padding:0 0 15px;gap:16px;align-items:center}.plus{font-size:26px;color:var(--accent);font-weight:300}input{min-width:0;flex:1;border:0;background:transparent;padding:13px 2px;color:var(--ink);font-size:16px;border-radius:0}input::placeholder{color:#969084}form button{background:var(--accent);color:#fff9ed;border:1px solid var(--accent);padding:14px 24px;font-size:13px;letter-spacing:1px;min-height:48px;transition:background .18s}form button:hover{background:#193b30}form button span{margin-left:19px}.hint{font-size:11px;color:var(--muted);margin:12px 0 0;min-height:18px}.list-head{margin-top:51px;display:flex;align-items:center;justify-content:space-between;padding-bottom:17px;border-bottom:1px solid var(--line)}h2{font-size:13px;font-weight:500;letter-spacing:2px;margin:0}.count{font-size:11px;color:var(--muted)}.count strong{font-weight:400;color:var(--ink)}.empty{text-align:center;padding:52px 10px 56px}.empty-index{font:24px SimSun,"Songti SC",serif;color:#aca393}.empty h3{font-family:SimSun,"Songti SC",serif;font-size:22px;font-weight:400;margin:16px 0 12px}.empty p{font-size:12px;line-height:1.9;color:var(--muted);margin:0}ul{padding:0;margin:0;list-style:none}.row{display:flex;align-items:center;gap:20px;min-height:91px;padding:18px 0;border-bottom:1px solid var(--line)}.number{font:italic 17px Georgia,serif;color:var(--muted);min-width:24px}.title{flex:1;min-width:0;font-family:SimSun,"Songti SC",serif;font-size:23px;line-height:1.5;overflow-wrap:anywhere}.read .title{color:var(--muted);text-decoration:line-through;text-decoration-thickness:1px;text-decoration-color:#b4aa99}.toggle{border:1px solid var(--line);background:transparent;color:var(--muted);padding:8px 11px;min-height:38px;font-size:11px;white-space:nowrap}.toggle:hover{border-color:var(--accent);color:var(--accent)}.read .toggle{color:var(--accent);border-color:#8ca79a}.delete{display:grid;place-items:center;background:none;border:0;color:var(--muted);width:36px;height:40px;padding:8px}.delete:hover{color:var(--accent)}footer{border-top:1px solid var(--ink);padding:23px 0 30px;display:flex;justify-content:space-between;gap:20px;color:var(--muted);font-size:10px;letter-spacing:1px;margin-top:15px}.footer-word{font-family:inherit;font-style:normal;letter-spacing:0;font-size:12px}.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}[hidden]{display:none!important}@media(min-width:900px){.page{padding-top:8px}}@media(max-width:600px){.page{padding:0 24px}header{height:80px}.brand{font-size:25px}.brand small{display:none}.edition{font-size:9px;letter-spacing:1px}.hero{padding:43px 0 34px;gap:10px}h1{font-size:47px}.eyebrow{font-size:9px;letter-spacing:2px;margin-bottom:20px}.intro{font-size:12px;max-width:220px;margin-top:19px}.art{width:80px;margin:13px 3px 0 0}.book{width:76px;height:100px}.book:before{left:10px}.book:after{right:12px;width:11px;height:38px}.book-lines{left:24px;top:45px;width:30px;height:18px}.art-caption{font-size:9px;margin:17px 0 0;width:76px;line-height:1.5;text-align:center;white-space:normal}form{gap:9px}input{font-size:13px}form button{padding:12px 14px;font-size:12px}form button span{margin-left:6px}.plus{font-size:22px}.list-head{margin-top:37px}.empty{padding:48px 0}.row{gap:10px}.title{font-size:20px}.toggle{padding:8px;font-size:10px}.delete{width:30px}footer{font-size:9px;letter-spacing:0}.footer-word{font-size:10px}}@media(prefers-reduced-motion:reduce){*{transition:none!important}}
.art-caption span{display:inline-block}</style>
</head>
<body>
<div class="page">
<header><div class="brand">纸间<small>在字里行间，安放阅读</small></div><div class="edition">一本一本，慢慢读。</div></header>
<main>
<section class="hero" aria-labelledby="page-title"><div><p class="eyebrow">为下一本好书，留一点位置</p><h1 id="page-title">喜欢的书，<br>慢慢读。</h1><p class="intro">给偶然遇见的好书，一个位置。<br>也给自己，留一点阅读的时间。</p></div><div class="art" aria-hidden="true"><div class="book"><div class="book-lines"></div></div><p class="art-caption"><span>一页一页，</span><span>慢慢来。</span></p></div></section>
<form id="add-form" novalidate><span class="plus" aria-hidden="true">＋</span><label class="sr-only" for="book-name">书名</label><input id="book-name" name="book" placeholder="下一本，你想读什么？" maxlength="200" autocomplete="off"><button type="submit">加入书单<span aria-hidden="true">↗</span></button></form>
<p class="hint" id="hint">写下书名，按回车键也可以添加。</p>
<section aria-labelledby="list-title"><div class="list-head"><h2 id="list-title">我的阅读清单</h2><div class="count">共 <strong id="total">0</strong> 本 <span aria-hidden="true"> / </span> 已读 <strong id="read-count">0</strong> 本</div></div><div class="empty" id="empty"><div class="empty-index" aria-hidden="true">序章</div><h3>故事，从第一本开始。</h3><p>书单还是空白的。<br>把惦记着的那本书，写在上面吧。</p></div><ul id="books" aria-label="阅读书单"></ul></section>
<p id="status" class="sr-only" role="status" aria-live="polite"></p>
</main>
<footer><span>只记此刻想读的 · 刷新后清单会清空</span><span class="footer-word">少刷一会儿，多读几页。</span></footer>
</div>
<script>
const form=document.querySelector('#add-form'),input=document.querySelector('#book-name'),list=document.querySelector('#books'),hint=document.querySelector('#hint'),status=document.querySelector('#status');
let books=[],nextId=1;
function announce(message){status.textContent=message}
function render(){list.replaceChildren();document.querySelector('#empty').hidden=books.length>0;document.querySelector('#total').textContent=books.length;document.querySelector('#read-count').textContent=books.filter(b=>b.read).length;books.forEach((book,index)=>{const row=document.createElement('li');row.className='row'+(book.read?' read':'');const number=document.createElement('span');number.className='number';number.textContent=String(index+1).padStart(2,'0');number.setAttribute('aria-hidden','true');const title=document.createElement('span');title.className='title';title.textContent=book.title;const toggle=document.createElement('button');toggle.type='button';toggle.className='toggle';toggle.textContent=book.read?'✓ 已读':'标记已读';toggle.setAttribute('aria-label',(book.read?'标记为未读：':'标记为已读：')+book.title);toggle.setAttribute('aria-pressed',String(book.read));toggle.onclick=()=>{book.read=!book.read;render();list.children[index].querySelector('.toggle').focus();announce('《'+book.title+'》已标记为'+(book.read?'已读':'未读'))};const remove=document.createElement('button');remove.type='button';remove.className='delete';remove.setAttribute('aria-label','删除：'+book.title);remove.innerHTML='<svg width="15" height="17" viewBox="0 0 18 20" fill="none" stroke="currentColor" stroke-width="1.2" aria-hidden="true"><path d="M2 5h14M7 2h4l1 3M4 5l1 13h8l1-13M7 8v7M11 8v7"/></svg>';remove.onclick=()=>{books=books.filter(b=>b.id!==book.id);render();const next=list.children[Math.min(index,books.length-1)];if(next)next.querySelector('.delete').focus();else input.focus();announce('已删除《'+book.title+'》')};row.append(number,title,toggle,remove);list.append(row)})}
form.addEventListener('submit',event=>{event.preventDefault();const title=input.value.trim();if(!title){hint.textContent='先写下一个书名，再加入书单。';input.setAttribute('aria-invalid','true');input.focus();return}books.push({id:nextId++,title,read:false});input.value='';input.removeAttribute('aria-invalid');hint.textContent='写下书名，按回车键也可以添加。';render();announce('已加入《'+title+'》');input.focus()});input.setAttribute('aria-describedby','hint');input.addEventListener('input',()=>{input.removeAttribute('aria-invalid');hint.textContent='写下书名，按回车键也可以添加。'});render();
</script>
</body>
</html>
